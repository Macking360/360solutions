<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="t d">
  <title id="t">Operator working late under a desk lamp</title>
  <desc id="d">A serious man in a blue plaid button shirt sits at a desk at midnight, one hand pinching his forehead in thought, pen in the other hand over a booklet, lit dramatically by a modern desk lamp.</desc>
  <defs>
    <radialGradient id="room" cx="78%" cy="45%" r="85%">
      <stop offset="0" stop-color="#2a2417"/>
      <stop offset="0.45" stop-color="#0f141c"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="cone" x1="0.8" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffb85c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d1"/>
      <stop offset="0.35" stop-color="#ffd58a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a1c"/>
      <stop offset="0.4" stop-color="#1f1610"/>
      <stop offset="1" stop-color="#0c0906"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f5a40"/>
      <stop offset="0.45" stop-color="#c58d68"/>
      <stop offset="1" stop-color="#f0bf8f"/>
    </linearGradient>
    <linearGradient id="skinHand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86f4e"/>
      <stop offset="1" stop-color="#e6b184"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02050a" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#02050a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdbf9f"/>
      <stop offset="1" stop-color="#fff0cf"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="0.6" stop-color="#3a4452"/>
      <stop offset="1" stop-color="#8a97a8"/>
    </linearGradient>

    <pattern id="plaid" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="44" height="44" fill="#2a58a3"/>
      <rect x="0" y="0" width="12" height="44" fill="#16356b" opacity="0.55"/>
      <rect x="0" y="0" width="44" height="12" fill="#16356b" opacity="0.55"/>
      <rect x="24" y="0" width="4" height="44" fill="#9cc4f2" opacity="0.7"/>
      <rect x="0" y="24" width="44" height="4" fill="#9cc4f2" opacity="0.7"/>
      <rect x="35" y="0" width="1.5" height="44" fill="#e9f2ff" opacity="0.45"/>
      <rect x="0" y="35" width="44" height="1.5" fill="#e9f2ff" opacity="0.45"/>
    </pattern>
    <clipPath id="torsoClip"><path id="torso" d="M118 720V525C118 455 170 412 238 396H342C410 412 462 455 462 525V720Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- room -->
  <rect width="640" height="720" fill="url(#room)"/>

  <!-- night window with distant lights -->
  <g opacity="0.55">
    <rect x="34" y="46" width="150" height="190" rx="4" fill="#070b12" stroke="#1d2735" stroke-width="3"/>
    <path d="M109 46V236M34 141H184" stroke="#1d2735" stroke-width="3"/>
    <g fill="#6bb8ff" opacity="0.55">
      <circle cx="58" cy="206" r="2.4"/><circle cx="76" cy="196" r="1.8"/><circle cx="96" cy="212" r="2.2"/>
      <circle cx="130" cy="200" r="2.6"/><circle cx="152" cy="214" r="1.8"/><circle cx="165" cy="190" r="2"/>
      <circle cx="70" cy="172" r="1.6"/><circle cx="142" cy="170" r="1.6"/>
    </g>
    <g fill="#ffd58a" opacity="0.6"><circle cx="86" cy="180" r="1.8"/><circle cx="120" cy="186" r="1.8"/><circle cx="52" cy="186" r="1.6"/></g>
  </g>

  <!-- wall clock reading midnight -->
  <g transform="translate(112 300)" opacity="0.8">
    <circle r="30" fill="#0b1018" stroke="#2a3950" stroke-width="3"/>
    <g stroke="#a4b1c4" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M0 -25V-21M25 0H21M0 25V21M-25 0H-21"/>
    </g>
    <path d="M0 0V-20" stroke="#e8edf5" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0V-14" stroke="#ffd58a" stroke-width="3.5" stroke-linecap="round"/>
    <circle r="3" fill="#ffd58a"/>
  </g>

  <!-- light cone from lamp -->
  <polygon points="430,376 470,414 560,720 20,720" fill="url(#cone)" filter="url(#soft2)" style="mix-blend-mode:screen"/>

  <!-- figure -->
  <!-- torso -->
  <use href="#torso" fill="url(#plaid)"/>
  <g clip-path="url(#torsoClip)">
    <!-- placket + buttons -->
    <rect x="283" y="440" width="14" height="300" fill="#1a3f7f" opacity="0.8"/>
    <g fill="#dfe9f7">
      <circle cx="290" cy="478" r="4.5"/><circle cx="290" cy="528" r="4.5"/><circle cx="290" cy="578" r="4.5"/>
    </g>
    <!-- folds -->
    <path d="M190 470C200 520 196 560 180 600M392 470C384 520 388 560 402 600" stroke="#06101f" stroke-opacity="0.35" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="100" y="380" width="380" height="360" fill="url(#shade)"/>
  </g>
  <!-- collar + neck -->
  <path d="M258 340H322L328 408L290 436L252 408Z" fill="url(#skin)"/>
  <path d="M262 372C280 392 300 392 318 372L322 340H258Z" fill="#000" opacity="0.28"/>
  <path d="M246 392L290 440L262 462L228 412Z" fill="url(#plaid)"/>
  <path d="M334 392L290 440L318 462L352 412Z" fill="url(#plaid)"/>
  <path d="M246 392L290 440L262 462L228 412Z" fill="#02050a" opacity="0.4"/>
  <path d="M334 392L290 440L318 462L352 412Z" fill="#ffb85c" opacity="0.12"/>
  <path d="M246 392L290 440M334 392L290 440" stroke="#0e2850" stroke-width="2" opacity="0.8"/>

  <!-- head (tilted slightly down and toward the hand) -->
  <g transform="rotate(-5 290 262)">
    <ellipse cx="228" cy="276" rx="9" ry="17" fill="#8f5a40"/>
    <ellipse cx="352" cy="276" rx="10" ry="18" fill="#e3ae82"/>
    <path d="M228 238C226 196 252 176 292 176C336 176 358 204 354 246C354 296 336 336 292 346C250 346 230 300 228 238Z" fill="url(#skin)"/>
    <!-- jaw shadow / stubble -->
    <path d="M232 280C240 326 264 346 292 346C324 346 346 322 352 276C348 318 326 332 292 332C262 332 240 318 232 280Z" fill="#2a1a12" opacity="0.38"/>
    <!-- hair -->
    <path d="M226 252C218 190 248 164 294 164C342 164 366 196 358 252C352 222 340 206 322 200C292 214 258 212 238 206C230 218 228 234 226 252Z" fill="#14100e"/>
    <path d="M300 168C326 170 346 186 352 214" stroke="#5a4636" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- brows: furrowed, serious -->
    <path d="M250 262L282 270" stroke="#14100e" stroke-width="7" stroke-linecap="round"/>
    <path d="M300 270L334 260" stroke="#14100e" stroke-width="7" stroke-linecap="round"/>
    <!-- eyes cast down -->
    <path d="M254 282C262 288 274 288 282 282" stroke="#241712" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M302 282C310 288 322 288 332 281" stroke="#241712" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M258 291C265 295 272 295 278 291M306 291C313 295 320 295 328 291" stroke="#6e4630" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M292 284C288 304 284 312 280 316C288 322 300 322 308 316" stroke="#7a4a33" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M300 286C304 300 306 310 308 314" stroke="#ffe0b8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.45"/>
    <!-- mouth: flat, slightly downturned -->
    <path d="M272 330C284 326 302 326 316 331" stroke="#4a2a1d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- lamp-side rim light on face -->
    <path d="M354 246C354 296 340 332 304 344C336 336 358 304 358 250Z" fill="#ffe3b0" opacity="0.5"/>
    <!-- cool shadow on camera-left side -->
    <path d="M228 238C228 300 250 346 292 346C246 346 224 306 226 250Z" fill="#02050a" opacity="0.45"/>
  </g>

  <!-- desk -->
  <rect x="0" y="574" width="640" height="146" fill="url(#desk)"/>
  <rect x="0" y="572" width="640" height="4" fill="#6b4a2e" opacity="0.7"/>
  <ellipse cx="330" cy="650" rx="300" ry="62" fill="url(#pool)" style="mix-blend-mode:screen"/>

  <!-- booklet -->
  <g>
    <path d="M196 612L338 600L470 606L488 668L334 690L180 676Z" fill="#06080c" opacity="0.55" filter="url(#soft)"/>
    <path d="M200 606L334 596L468 602L482 660L334 676L186 664Z" fill="#e9dcc0"/>
    <path d="M334 596L334 676" stroke="#9c8d6e" stroke-width="2.5"/>
    <path d="M200 606L334 596L334 676L186 664Z" fill="url(#page)"/>
    <path d="M334 596L468 602L482 660L334 676Z" fill="#fff0cf"/>
    <g stroke="#8a7d62" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M210 622L322 613M208 634L322 626M206 646L322 639M204 658L322 652"/>
      <path d="M348 612L456 617M348 624L458 630M348 636L460 643"/>
    </g>
    <path d="M348 652L420 656" stroke="#2a58a3" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- left arm: elbow on desk, hand pinching forehead -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M166 448L128 584L222 326" stroke="url(#plaid)" stroke-width="64" transform="translate(0 0)"/>
    <path d="M166 448L128 584L222 326" stroke="url(#shade)" stroke-width="64" opacity="0.8"/>
    <path d="M128 584L222 326" stroke="#02050a" stroke-opacity="0.28" stroke-width="64"/>
    <!-- cuff -->
    <path d="M216 342L224 320" stroke="#6f93c9" stroke-width="56"/>
    <path d="M216 342L224 320" stroke="#02050a" stroke-opacity="0.4" stroke-width="56"/>
  </g>
  <!-- hand: heel + curled fingers -->
  <g transform="rotate(-5 290 262)">
    <path d="M214 300C206 270 214 246 236 236C252 232 262 246 258 262C256 282 252 304 238 318Z" fill="url(#skinHand)"/>
    <!-- index finger lying across the forehead -->
    <path d="M232 226C256 218 282 218 298 224" stroke="#8f5a40" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M232 223C256 215 282 215 298 221" stroke="#e6b184" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- thumb at the temple -->
    <path d="M236 262C246 262 254 258 262 254" stroke="#8f5a40" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M236 260C246 260 254 256 262 252" stroke="#d9a077" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- knuckles -->
    <g fill="#8f5a40" opacity="0.85"><circle cx="222" cy="262" r="6"/><circle cx="220" cy="280" r="6"/><circle cx="224" cy="297" r="5.5"/></g>
  </g>

  <!-- right arm: pen hand -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M424 448L452 584L360 612" stroke="url(#plaid)" stroke-width="64"/>
    <path d="M424 448L452 584L360 612" stroke="#ffb85c" stroke-opacity="0.12" stroke-width="64"/>
    <path d="M452 584L360 612" stroke="#fff" stroke-opacity="0.07" stroke-width="64"/>
    <path d="M368 608L350 614" stroke="#6f93c9" stroke-width="54"/>
    <path d="M368 608L350 614" stroke="#ffb85c" stroke-opacity="0.15" stroke-width="54"/>
  </g>
  <!-- hand + pen -->
  <path d="M352 598C336 596 320 604 316 618C316 630 330 634 346 628L356 620Z" fill="url(#skinHand)"/>
  <path d="M322 606C312 612 308 622 312 630" stroke="#8f5a40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g stroke-linecap="round">
    <path d="M372 574L312 630" stroke="#0b0f14" stroke-width="8"/>
    <path d="M372 574L362 584" stroke="#ffd58a" stroke-width="4"/>
    <path d="M312 630L300 641" stroke="#cfd6df" stroke-width="3.5"/>
  </g>
  <path d="M300 641L296 645" stroke="#1a2a4a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- modern desk lamp -->
  <g>
    <ellipse cx="548" cy="606" rx="52" ry="12" fill="#02050a" opacity="0.65" filter="url(#soft)"/>
    <ellipse cx="548" cy="598" rx="46" ry="10" fill="url(#metal)"/>
    <ellipse cx="548" cy="594" rx="46" ry="10" fill="#1b222c"/>
    <path d="M548 592L548 520L520 440" stroke="#11161d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M552 590L552 522L524 442" stroke="#6b7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    <circle cx="548" cy="520" r="9" fill="#232b36" stroke="#6b7889" stroke-width="2"/>
    <circle cx="520" cy="440" r="9" fill="#232b36" stroke="#6b7889" stroke-width="2"/>
    <path d="M520 440L492 372" stroke="#11161d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="492" cy="372" r="8" fill="#232b36" stroke="#6b7889" stroke-width="2"/>
    <!-- hood shade opening toward the desk -->
    <path d="M498 330L538 352L470 418L426 378Z" fill="url(#metal)"/>
    <path d="M498 330L538 352L530 362L492 342Z" fill="#8a97a8" opacity="0.55"/>
    <path d="M426 378L470 418" stroke="#fff3d1" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- bulb glow -->
  <circle cx="448" cy="398" r="58" fill="url(#bulb)" style="mix-blend-mode:screen"/>
  <circle cx="448" cy="398" r="130" fill="url(#bulb)" opacity="0.35" style="mix-blend-mode:screen"/>

  <!-- dust motes in the beam -->
  <g fill="#ffe3b0" opacity="0.55">
    <circle cx="410" cy="470" r="1.6"/><circle cx="440" cy="520" r="1.2"/><circle cx="380" cy="540" r="1.4"/>
    <circle cx="500" cy="500" r="1.5"/><circle cx="470" cy="560" r="1.1"/><circle cx="420" cy="430" r="1.2"/>
  </g>

  <!-- vignette -->
  <rect width="640" height="720" fill="url(#room)" opacity="0"/>
  <radialGradient id="vig" cx="55%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="640" height="720" fill="url(#vig)"/>
</svg>
